name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Matches the documented floor ("Python 3.10+") in code/README.md.
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The triage code is standard-library only; pyflakes is the sole dev tool.
      - name: Install lint tooling
        run: python -m pip install --upgrade pyflakes

      - name: Lint (pyflakes)
        run: python -m pyflakes code

      - name: Byte-compile
        run: python -m compileall -q code

      - name: Run test suite
        run: python code/run_tests.py
